name: Release

# Build and push the caw image to GHCR on a semver tag, then trigger a
# Dokploy redeploy via webhook so production rolls forward.
#
# Trigger: pushing `vX.Y.Z` (e.g. `git tag v0.2.0 && git push --tags`).
# No tag = no ship. Keeps releases deliberate; commits on `main` still flow
# through CI but don't auto-deploy.
#
# The Dokploy compose pins `ghcr.io/ravencloak-org/caw:latest` with
# `pull_policy: always`, so a fresh `:latest` push is what makes the
# webhook-driven `docker compose up -d` actually pull new code.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # gh release create
  packages: write   # GHCR push

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave a writable token in the local git config for later
          # steps; build/push uses its own scoped GHCR token, and webhook
          # uses a separately-scoped Dokploy URL.
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        # POSTs the compose-service webhook. Dokploy responds with the
        # queued deployment id; it does NOT block on container start.
        # The compose is configured with `pull_policy: always`, so the
        # ensuing `docker compose up -d` pulls the `:latest` tag we just
        # pushed and recreates the hub container.
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL secret unset; skipping redeploy."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dokploy-resp -w '%{http_code}' -X POST "$WEBHOOK")
          echo "Dokploy webhook HTTP $status"
          cat /tmp/dokploy-resp || true
          # Surface any 4xx/5xx as a job failure so the Actions UI reflects
          # whether the deploy was actually queued.
          test "$status" -ge 200 && test "$status" -lt 300

  github-release:
    name: GitHub Release
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh needs full history to diff against the previous tag

      - name: Create release with auto-generated notes
        # --generate-notes pulls PR titles/labels since the previous tag and
        # groups them per .github/release.yml. --verify-tag refuses if the tag
        # ref we got triggered on doesn't actually exist on the remote.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag

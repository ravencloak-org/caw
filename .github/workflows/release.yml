name: Release

# Build and push the caw image to GHCR on a semver tag, then trigger a
# Dokploy redeploy via webhook so production rolls forward.
#
# Trigger: pushing `vX.Y.Z` (e.g. `git tag v0.2.0 && git push --tags`).
# No tag = no ship. Keeps releases deliberate; commits on `main` still flow
# through CI but don't auto-deploy.
#
# The Dokploy compose pins `ghcr.io/ravencloak-org/caw:latest` with
# `pull_policy: always`, so a fresh `:latest` push is what makes the
# webhook-driven `docker compose up -d` actually pull new code.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # gh release create
  packages: write   # GHCR push

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave a writable token in the local git config for later
          # steps; build/push uses its own scoped GHCR token, and webhook
          # uses a separately-scoped Dokploy URL.
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy redeploy
        # POSTs the compose-service webhook. Dokploy responds with the
        # queued deployment id; it does NOT block on container start.
        # The compose is configured with `pull_policy: always`, so the
        # ensuing `docker compose up -d` pulls the `:latest` tag we just
        # pushed and recreates the hub container.
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL secret unset; skipping redeploy."
            exit 0
          fi
          status=$(curl -sS -o /tmp/dokploy-resp -w '%{http_code}' -X POST "$WEBHOOK")
          echo "Dokploy webhook HTTP $status"
          cat /tmp/dokploy-resp || true
          # Surface any 4xx/5xx as a job failure so the Actions UI reflects
          # whether the deploy was actually queued.
          test "$status" -ge 200 && test "$status" -lt 300

  build-watcher:
    name: Build Watcher binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin,  goarch: arm64, ext: ""     }
          - { goos: darwin,  goarch: amd64, ext: ""     }
          - { goos: linux,   goarch: arm64, ext: ""     }
          - { goos: linux,   goarch: amd64, ext: ""     }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build caw-watcher
        # CGO disabled keeps the binary statically linked and portable across
        # libc variants. -s -w strips the symbol table and DWARF for size.
        # -X main.version=${GITHUB_REF_NAME} bakes the release tag in so
        # `caw-watcher --version` reports the tag, not "dev".
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/watcher

      - name: Archive (tar.gz)
        if: matrix.goos != 'windows'
        run: |
          tar -czf caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz \
            caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Archive (zip)
        if: matrix.goos == 'windows'
        run: |
          zip caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}.zip \
            caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          # One artifact per matrix row; name includes os+arch so they don't collide.
          # download-artifact in github-release uses pattern + merge-multiple to gather.
          name: caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: caw-watcher-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: GitHub Release
    needs: [build-push, build-watcher]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gh needs full history to diff against the previous tag

      - name: Download watcher archives
        uses: actions/download-artifact@v8
        with:
          pattern: caw-watcher-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum caw-watcher-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release with auto-generated notes
        # --generate-notes pulls PR titles/labels since the previous tag and
        # groups them per .github/release.yml. --verify-tag refuses if the tag
        # ref we got triggered on doesn't actually exist on the remote.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag

      - name: Upload watcher archives + checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: dist
        # --clobber overwrites assets if a re-run re-uploads them.
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            caw-watcher-*.tar.gz \
            caw-watcher-*.zip \
            SHA256SUMS.txt \
            --clobber

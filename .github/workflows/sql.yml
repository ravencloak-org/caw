name: SQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlfluff:
    name: SQLFluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "sqlfluff==4.2.2"
      - name: Lint SQL
        run: sqlfluff lint .

coverage:
  status:
    project:
      default:
        target: auto      # never drop below the current level
        threshold: 1%
    patch:
      default:
        target: 80%       # new/changed code must be well covered
        threshold: 5%

# Thin server / MCP-tool wiring — exercised by running the binary, not by
# unit tests. The actual logic these files call into lives in internal/
# packages, which are covered there.
ignore:
  - "cmd/hub/main.go"
  - "cmd/watcher/main.go"
  - "cmd/watcher/auth_tools.go"

# Coverage is uploaded under two flags from two CI jobs (see .github/workflows/ci.yml):
#   unit        — every package except internal/server
#   integration — internal/server end-to-end suite
# carryforward keeps a flag's last result if its job is skipped on a given run.
flags:
  unit:
    carryforward: true
  integration:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

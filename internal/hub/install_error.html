<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>caw — {{.Title}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<style>
:root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #555; --accent: #0066cc; --warn-bg: #fff4e5; --warn-fg: #663300; --code-bg: #f4f4f4; --border: #ddd; }
@media (prefers-color-scheme: dark) {
  :root { --fg: #eee; --bg: #161616; --muted: #aaa; --accent: #5aa8ff; --warn-bg: #3a2a10; --warn-fg: #f5d28a; --code-bg: #202020; --border: #333; }
}
html, body { background: var(--bg); color: var(--fg); margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
main { max-width: 720px; margin: 2.5rem auto; padding: 0 1.25rem; }
h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
h2 { font-size: 1.05rem; margin: 1.5rem 0 0.5rem; }
.sub { color: var(--muted); margin: 0 0 1.5rem; font-size: 0.9rem; }
.sub code { background: var(--code-bg); padding: 0.1rem 0.4rem; border-radius: 3px; }
p { margin: 0.5rem 0; }
ul { padding-left: 1.25rem; margin: 0.25rem 0 0; }
li { margin: 0.4rem 0; }
a.btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 0.6rem 1.1rem; font-size: 0.9rem; font-weight: 600; text-decoration: none; margin-top: 1.25rem; }
a.btn:hover { filter: brightness(1.1); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.9em; }
a { color: var(--accent); }
.meta { color: var(--muted); font-size: 0.85rem; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
</style>
</head>
<body>
<main>
  <h1>{{.Title}}</h1>
  <p class="sub">Hub: <a href="{{.HubURL}}">{{.HubURL}}</a> · Code: <code>{{.Code}}</code></p>

  <h2>What happened</h2>
  <p>{{.LongMessage}}</p>

  <h2>What to do</h2>
  <ul>
  {{range .Steps}}<li>{{.}}</li>
  {{end}}</ul>

  {{if .RetryURL}}<a class="btn" href="{{.RetryURL}}">{{.RetryLabel}}</a>{{end}}

  <hr>
  <p class="meta">Operators: see <a href="https://github.com/ravencloak-org/caw/blob/main/docs/install/SELF-HOST.md">docs/install/SELF-HOST.md</a> for the full self-host install + GitHub App settings walkthrough.</p>
</main>
</body>
</html>
